<style type="text/css">
    .gen-slideshow {
        position: relative;
        width: 100%;
        max-width: 1940px;
        margin: 0 auto;
        overflow: hidden;
    }

    .gen-slides {
        display: flex;
        transition: transform 0.5s ease-in-out;
        width: 100%;
    }

    .gen-slide {
        min-width: 100%;
        box-sizing: border-box;
    }

    .gen-slide img {
        display: block;
        width: 100%;
        height: auto;
    }

    .gen-dots {
        position: absolute;
        bottom: 15px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 10px;
        z-index: 10;
    }

    .gen-dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background-color: #ccc;
        cursor: pointer;
        transition: background-color 0.3s;
    }

    .gen-dot.active {
        background-color: #333;
    }
</style>

<div class="gen-slideshow">
    <div class="gen-slides">
        <div class="gen-slide">
            <a href="https://www.thermofisher.com/br/en/home/products-and-services/promotions.html" target="_blank">
                <img src="https://www.thermofisher.com/content/dam/LifeTech/latin-america/2025/Banners/home/image_a26b.img.full.high.png" alt="Banner 1">
            </a>
        </div>
        <div class="gen-slide">
            <a href="https://www.thermofisher.com/br/en/home/products-and-services/promotions/workflow-bid-extraction.html" target="_blank">
                <img src="https://www.thermofisher.com/content/dam/LifeTech/latin-america/2025/Banners/home/Banner%201%20-%20BNO%20-%20Workflows%202%20-%20BR%20-%20Roxo.png" alt="Banner 2">
            </a>
        </div>
    </div>

    <div class="gen-dots">
        <div class="gen-dot active" data-index="0"></div>
        <div class="gen-dot" data-index="1"></div>
    </div>
</div>

<script>
    const slidesContainer = document.querySelector('.gen-slides');
    const slideshowElement = document.querySelector('.gen-slideshow');
    const dots = document.querySelectorAll('.gen-dot');
    let currentIndex = 0;
    const totalSlides = dots.length;

    function goToSlide(index) {
        const slideWidth = slideshowElement.offsetWidth;
        slidesContainer.style.transform = `translateX(-${index * slideWidth}px)`;
        dots.forEach(dot => dot.classList.remove('active'));
        dots[index].classList.add('active');
        currentIndex = index;
    }

    function nextSlide() {
        const nextIndex = (currentIndex + 1) % totalSlides;
        goToSlide(nextIndex);
    }

    let interval = setInterval(nextSlide, 7000);

    dots.forEach(dot => {
        dot.addEventListener('click', () => {
            clearInterval(interval);
            goToSlide(parseInt(dot.getAttribute('data-index')));
            interval = setInterval(nextSlide, 7000);
        });
    });

    window.addEventListener('resize', () => {
        goToSlide(currentIndex);
    });
</script>
